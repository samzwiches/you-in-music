<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#08070d" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Creator Room | You In Music</title>
  <link rel="stylesheet" href="./you-in-music.css" />
</head>
<body class="v3-page">
  <main class="yim-admin-grid">
    <section class="yim-admin-card">
      <p class="v2-overline">PRIVATE CREATOR ROOM</p>
      <h1>Orders become<br><em>songs in here.</em></h1>
      <p>Paid stories only. The admin token stays in this browser session and is never stored in the site code.</p>
      <div class="yim-admin-login">
        <input id="token" type="password" placeholder="Creator password" />
        <button id="load" type="button">Open creator room</button>
      </div>
      <p class="yim-status" id="status"></p>
      <div class="yim-orders" id="orders"></div>
    </section>
  </main>
  <script>
    const tokenEl=document.getElementById('token');
    const statusEl=document.getElementById('status');
    const ordersEl=document.getElementById('orders');
    tokenEl.value=sessionStorage.getItem('yim-admin-token')||'';
    document.getElementById('load').onclick=loadOrders;

    async function loadOrders(){
      const token=tokenEl.value.trim();
      if(!token)return;
      statusEl.textContent='Opening…';
      const r=await fetch('/api/admin/orders',{headers:{authorization:'Bearer '+token}});
      const d=await r.json();
      if(!r.ok){
        statusEl.className='yim-status error';
        statusEl.textContent=d.error||'Could not open creator room.';
        return;
      }
      sessionStorage.setItem('yim-admin-token',token);
      statusEl.className='yim-status success';
      statusEl.textContent=`${d.orders.length} order${d.orders.length===1?'':'s'} in the room.`;
      ordersEl.innerHTML='';
      d.orders.forEach(renderOrder);
    }

    function renderOrder(o){
      const story=parseStory(o.story_json);
      const el=document.createElement('article');
      el.className='yim-order';
      el.innerHTML=`<div class="yim-order-head"><div><h3>${esc(o.customer_name)} · ${esc(labelTier(o.tier))}</h3><div class="yim-order-meta">${esc(o.email)} · $${(o.amount_cents/100).toFixed(2)} · ${esc(o.status)}</div></div></div><div class="yim-order-story">${block('For',o.song_for_name||o.recipient)}${block('Relationship',o.relationship)}${block('Feeling',o.feeling)}${block('Sound',o.sound_style)}${storyBlocks(story)}${block('Must include',o.must_include)}${block('Avoid',o.must_avoid)}</div><div class="yim-order-actions"><button data-copy>Copy creation brief</button><select data-status><option value="paid">Paid</option><option value="ready_to_create">Ready to create</option><option value="in_progress">In progress</option><option value="preview_sent">Preview sent</option><option value="complete">Complete</option></select><button data-save>Save status</button></div>`;
      el.querySelector('[data-status]').value=o.status;
      el.querySelector('[data-copy]').onclick=()=>navigator.clipboard.writeText(brief(o,story));
      el.querySelector('[data-save]').onclick=()=>saveStatus(o.id,el.querySelector('[data-status]').value);
      ordersEl.appendChild(el);
    }

    function parseStory(raw){
      if(!raw)return {};
      try{return JSON.parse(raw)||{}}catch{return {}}
    }

    function storyBlocks(s){
      const items=[
        ['Scene',s.core_scene],
        ['Image',s.scene_image],
        ['Unsaid truth',s.unsaid_truth],
        ['Complication',s.contradiction],
        ['Truth at the end',s.final_truth],
        ['Sensory details',s.sensory_details],
        ['Ritual',s.ritual],
        ['Turning point',s.turning_point],
        ['Motif',s.motif],
        ['Anything else',s.anything_else]
      ];
      return items.map(([k,v])=>block(k,v)).join('');
    }

    function block(k,v){
      return v?`<div><small>${esc(k)}</small>${esc(v)}</div>`:'';
    }

    function esc(v){
      return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function labelTier(t){
      return ({quick:'Quick Spark',deep:'Deep Dive',signature:'Signature Piece'})[t]||t;
    }

    function brief(o,s){
      const lines=[
        'YOU IN MUSIC · CREATION BRIEF',
        '',
        'Package: '+labelTier(o.tier),
        'Customer: '+(o.customer_name||''),
        'Song for: '+(o.song_for_name||o.recipient||''),
        'Relationship: '+(o.relationship||''),
        'Feeling: '+(o.feeling||''),
        'Sound: '+(o.sound_style||''),
        '',
        'CORE SCENE',
        s.core_scene||o.core_story||'',
        '',
        'WHAT THEY NEED UNDERSTOOD',
        s.unsaid_truth||'',
        '',
        'COMPLICATION',
        s.contradiction||'',
        '',
        'TRUTH AT THE END',
        s.final_truth||'',
        '',
        'FINGERPRINTS',
        [s.scene_image,s.sounds,s.sensory_details,s.ritual].filter(Boolean).join('\n'),
        '',
        'ARC',
        [s.before,s.turning_point,s.after].filter(Boolean).join('\n'),
        '',
        'MUST KEEP',
        s.must_keep||o.must_include||'',
        '',
        'DO NOT USE',
        s.no_go||o.must_avoid||'',
        '',
        'CREATIVE NOTES',
        'Perspective: '+(s.perspective||''),
        'Directness: '+(s.directness||''),
        'Profanity: '+(s.profanity||''),
        'Vocal: '+(s.vocal_preference||o.vocalist_pref||''),
        '',
        'ANYTHING ELSE',
        s.anything_else||o.private_notes||''
      ];
      return lines.join('\n');
    }

    async function saveStatus(id,status){
      const token=sessionStorage.getItem('yim-admin-token')||tokenEl.value.trim();
      const r=await fetch('/api/admin/status',{
        method:'POST',
        headers:{authorization:'Bearer '+token,'content-type':'application/json'},
        body:JSON.stringify({id,status})
      });
      const d=await r.json();
      statusEl.className=r.ok?'yim-status success':'yim-status error';
      statusEl.textContent=r.ok?'Status saved.':(d.error||'Could not save status.');
      if(r.ok)loadOrders();
    }
  </script>
</body>
</html>
