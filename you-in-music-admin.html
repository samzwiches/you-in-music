<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#08070d"/><title>Creator Room | You In Music</title><link rel="stylesheet" href="./you-in-music.css"/><link rel="stylesheet" href="./you-in-music-business.css"/></head><body class="v3-page"><main class="yim-admin-grid"><section class="yim-admin-card"><p class="v2-overline">PRIVATE CREATOR ROOM</p><h1>Orders become<br><em>songs in here.</em></h1><p>Paid stories only. Your admin token never gets stored in the site code.</p><div class="yim-admin-login"><input id="token" type="password" placeholder="Creator password"/><button id="load">Open creator room</button></div><p class="yim-status" id="status"></p><div class="yim-orders" id="orders"></div></section></main><script>
const tokenEl=document.getElementById('token'),statusEl=document.getElementById('status'),ordersEl=document.getElementById('orders');tokenEl.value=sessionStorage.getItem('yim-admin-token')||'';document.getElementById('load').onclick=loadOrders;
async function loadOrders(){const token=tokenEl.value.trim();if(!token)return;statusEl.textContent='Opening…';const r=await fetch('/api/admin/orders',{headers:{authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){statusEl.className='yim-status error';statusEl.textContent=d.error||'Nope.';return;}sessionStorage.setItem('yim-admin-token',token);statusEl.className='yim-status success';statusEl.textContent=`${d.orders.length} order${d.orders.length===1?'':'s'} in the room.`;ordersEl.innerHTML='';d.orders.forEach(renderOrder);}
function renderOrder(o){const el=document.createElement('article');el.className='yim-order';el.innerHTML=`<div class="yim-order-head"><div><h3>${esc(o.customer_name)} · ${esc(labelTier(o.tier))}</h3><div class="yim-order-meta">${esc(o.email)} · $${(o.amount_cents/100).toFixed(2)} · ${esc(o.status)}</div></div></div><div class="yim-order-story">${block('For',o.song_for_name||o.recipient)}${block('Relationship',o.relationship)}${block('Feeling',o.feeling)}${block('Sound',o.sound_style)}${block('Core story',o.core_story)}${block('Memories',o.memories)}${block('Must include',o.must_include)}${block('Avoid',o.must_avoid)}${block('Original phrase',o.phrase)}${block('Original place',o.place)}${block('Tiny detail',o.tiny_detail)}${block('Ending feeling',o.ending_feeling)}</div><div class="yim-order-actions"><button data-copy>Copy creation brief</button><select data-status><option value="paid">Paid</option><option value="ready_to_create">Ready to create</option><option value="in_progress">In progress</option><option value="preview_sent">Preview sent</option><option value="complete">Complete</option></select><button data-save>Save status</button></div>`;el.querySelector('[data-status]').value=o.status;el.querySelector('[data-copy]').onclick=()=>navigator.clipboard.writeText(brief(o));el.querySelector('[data-save]').onclick=()=>saveStatus(o.id,el.querySelector('[data-status]').value);ordersEl.appendChild(el);}
function block(k,v){return v?`<div><small>${esc(k)}</small>${esc(v)}</div>`:''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function labelTier(t){return ({quick:'Quick Spark',deep:'Deep Dive',signature:'Signature Piece'})[t]||t}function brief(o){return `YOU IN MUSIC · CREATION BRIEF\n\nPackage: ${labelTier(o.tier)}\nCustomer: ${o.customer_name}\nSong for: ${o.song_for_name||o.recipient||''}\nRelationship: ${o.relationship||''}\nFeeling: ${o.feeling||''}\nSound: ${o.sound_style||''}\n\nCORE STORY\n${o.core_story||''}\n\nMEMORIES / SCENES\n${o.memories||''}\n\nMUST INCLUDE\n${o.must_include||''}\n\nAVOID\n${o.must_avoid||''}\n\nEARLY JOURNEY DETAILS\nPhrase: ${o.phrase||''}\nPlace: ${o.place||''}\nTiny detail: ${o.tiny_detail||''}\nEnding feeling: ${o.ending_feeling||''}\n\nCREATIVE NOTES\nGenre: ${o.genre_notes||''}\nVocal: ${o.vocalist_pref||''}\nEnergy: ${o.energy_notes||''}\nLanguage: ${o.language_notes||''}\nPrivate notes: ${o.private_notes||''}`}
async function saveStatus(id,status){const token=sessionStorage.getItem('yim-admin-token')||tokenEl.value.trim();const r=await fetch('/api/admin/status',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({id,status})});const d=await r.json();statusEl.className=r.ok?'yim-status success':'yim-status error';statusEl.textContent=r.ok?'Status saved.':(d.error||'Could not save status.');if(r.ok)loadOrders();}
</script></body></html>
