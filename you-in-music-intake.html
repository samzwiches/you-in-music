<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#08070d"/><title>Your Story Room | You In Music</title><link rel="stylesheet" href="./you-in-music.css"/><link rel="stylesheet" href="./you-in-music-business.css"/></head><body class="v3-page"><header class="v2-nav"><a class="v2-brand" href="./index.html"><span class="v2-brand-mark"><i></i><i></i><i></i><i></i><i></i></span><span><strong>You In Music</strong><small>made from a life, not a template</small></span></a></header><main class="yim-intake-grid"><section class="yim-intake-card"><p class="v2-overline">THE PRIVATE STORY ROOM</p><h1>Now tell me the part<br><em>the song cannot guess.</em></h1><p id="intro">Confirming payment and opening your story room…</p><div class="yim-intake-summary yim-hidden" id="summary"></div><form id="intakeForm" class="yim-form-grid yim-hidden"><label><span>Who is the song for?</span><input name="song_for_name" placeholder="Name or nickname"/></label><label><span>Your relationship</span><input name="relationship" placeholder="partner, mom, me, best friend…"/></label><label><span>How should their name be pronounced?</span><input name="pronunciation" placeholder="Optional pronunciation help"/></label><label><span>Important date</span><input name="occasion_date" type="date"/></label><label class="full"><span>Tell me the story in your own words</span><textarea name="core_story" required placeholder="Messy is welcome. Start anywhere."></textarea></label><label class="full"><span>Memories, scenes, places, inside jokes</span><textarea name="memories" placeholder="The details only your people would recognize…"></textarea></label><label class="full"><span>What absolutely has to make it into the song?</span><textarea name="must_include"></textarea></label><label class="full"><span>Anything I should avoid?</span><textarea name="must_avoid"></textarea></label><label><span>Genre or sound notes</span><input name="genre_notes" placeholder="country, piano ballad, gritty rock…"/></label><label><span>Vocal preference</span><input name="vocalist_pref" placeholder="female, male, either, unsure"/></label><label><span>Energy</span><input name="energy_notes" placeholder="quiet, huge, playful, raw…"/></label><label><span>Language notes</span><input name="language_notes" placeholder="clean, swear if it fits, family friendly…"/></label><label class="full"><span>Anything private I should know?</span><textarea name="private_notes"></textarea></label><label class="full"><button class="yim-submit" type="submit">Send my story →</button></label><p class="yim-status full" id="status" aria-live="polite"></p></form></section></main><script>
(async()=>{const sessionId=new URLSearchParams(location.search).get('session_id');const intro=document.getElementById('intro'),form=document.getElementById('intakeForm'),summary=document.getElementById('summary'),status=document.getElementById('status');if(!sessionId){intro.textContent='This story room needs the secure checkout link.';return;}async function load(){const r=await fetch('/api/order?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not open the order.');return d.order;}try{let order=await load();if(!['paid','ready_to_create','in_progress','preview_sent','complete'].includes(order.status)){intro.textContent='Payment is still being confirmed. Refresh this page in a moment.';return;}intro.textContent='Payment confirmed. This room is private. Give me the details that make this song unmistakably yours.';summary.textContent=`${order.tier.replaceAll('_',' ')} · ${order.feeling||'feeling open'} · ${order.sound_style||'sound still open'}`;summary.classList.remove('yim-hidden');form.classList.remove('yim-hidden');form.addEventListener('submit',async e=>{e.preventDefault();status.className='yim-status';status.textContent='Saving your story…';const payload=Object.fromEntries(new FormData(form));payload.session_id=sessionId;const r=await fetch('/api/intake',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){status.className='yim-status error';status.textContent=d.error||'Could not save your story.';return;}status.className='yim-status success';status.textContent='Got it. Your story is in the creation queue.';form.querySelector('button').disabled=true;});}catch(err){intro.textContent=err.message;}})();
</script></body></html>
